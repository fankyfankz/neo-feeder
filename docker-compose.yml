services:
  app-pddikti:
    build:
      context: .
      dockerfile: Dockerfile
    image: fankyfankz/neo-feeder:1.0
    container_name: app-pddikti
    restart: unless-stopped
    tty: true
    environment:
      TZ: "Asia/Jakarta"
      SERVICE_NAME: "app"
      SERVICE_TAGS: "1.0"
      PGHOST: "db-pddikti"
      PGPORT: "54333"
    volumes:
      - ./app:/app
      - ./prefill_pddikti:/prefill_pddikti
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - app-network
    ports:
      - "8100:8100"
      - "3003:3003"
    depends_on:
      - db-pddikti

  db-pddikti:
    image: postgres:12
    container_name: db-pddikti
    environment:
      TZ: "Asia/Jakarta"
    restart: unless-stopped
    tty: true
    ports:
      - "127.0.0.1:54333:54333"
    volumes:
      - ./pgsql/data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.150.0/24